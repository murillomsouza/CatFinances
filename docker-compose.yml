services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/catfinances.db
    volumes:
      - .:/app          # o código fica na sua pasta e o container enxerga as mudanças na hora
      - ./data:/data    # o banco SQLite fica aqui (pasta ignorada pelo git)
    restart: unless-stopped
